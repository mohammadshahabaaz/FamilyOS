services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: familyos
      POSTGRES_PASSWORD: familyos
      POSTGRES_DB: familyos
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage standing in for Cloudflare R2 in local dev.
  # App code talks to it via the same presigned-upload S3 API it uses for real R2.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: familyos
      MINIO_ROOT_PASSWORD: familyos123
    ports:
      - "9010:9000"   # S3 API
      - "9011:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot init: creates the familyos-media bucket and makes it publicly
  # readable (GETs go straight to MinIO via R2_PUBLIC_URL, unsigned — mirrors
  # how a public R2 bucket/custom domain serves reads).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 familyos familyos123 &&
      mc mb -p local/familyos-media &&
      mc anonymous set download local/familyos-media
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
